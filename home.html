<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title and fav icon -->
  <title>Github Issue Tracker</title>
  <link rel="shortcut icon" href="asset/github-logo.png" type="image/x-icon">

  <!-- link style css -->
  <link rel="stylesheet" href="./style/style.css">

  <!-- Daisyui and tailwind css connect -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <!-- header section -->
  <header class="bg-slate-100 shadow-lg">
    <section class="flex justify-between items-center w-11/12 mx-auto py-5">
      <div class="flex items-center gap-2">
        <img src="asset/github-logo.png" alt="" class="w-[40px]">
        <h3 class="font-bold text-xl">GitHub Issues Tracker</h3>
      </div>
      <div class="flex items-center gap-2">
        <label class="input">
          <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </g>
          </svg>

          <!-- ADD ID HERE -->
          <input id="search-input" type="search" placeholder="Search issues..." />

        </label>

        <button id="search-btn" class="btn btn-primary">
          Search
        </button>
      </div>
    </section>
  </header>

  <section class="my-10 space-y-5">
    <!-- tab section -->
    <section id="tab-section" class="w-11/12 mx-auto bg-slate-100 rounded-xl p-10 flex gap-3">
      <button class="tab-btn btn btn-soft active" data-status="all">All</button>
      <button class="tab-btn btn btn-soft" data-status="open">Open</button>
      <button class="tab-btn btn btn-soft" data-status="closed">Closed</button>
    </section>


    <!-- issues section -->
    <section id="issues-section" class="w-11/12 mx-auto bg-slate-100 rounded-xl p-10 flex justify-between items-center">
      <div class="flex items-center gap-3 mb-5">
        <div class="p-3 bg-slate-200 rounded-full">
          <img src="asset/Aperture.png" class="w-8">
        </div>
        <div>
          <h3 class="font-bold text-lg">
            <span id="issues-count">0</span> Issues
          </h3>
          <p class="text-xl text-gray-500">Track and manage your project issues</p>
        </div>
      </div>
      <div class="flex gap-5">
        <span class="font-medium flex gap-2 items-center text-[#00c950]"><i class="fa-solid fa-circle"></i>Open</span>
        <span class="font-medium flex gap-2 items-center text-[#ae4aff]"><i class="fa-solid fa-circle"></i>Close</span>
      </div>
    </section>

    <!-- card section -->
    <section id="card-section" class="w-11/12 mx-auto bg-slate-100 rounded-xl p-10 grid grid-cols-3 gap-5">
      <!-- <div id="no-issue-found" class="col-span-3 items-center p-20 hidden">
        <img src="asset/Aperture.png" alt="" class="mx-auto">
        <h3 class="text-2xl font-semibold">No issues found</h3>
      </div> -->

      <!-- loading spinar -->
      <div id="spinner" class="col-span-3 flex justify-center items-center p-20 hidden">
        <span class="loading loading-infinity loading-2xl"></span>
      </div>

    </section>

    <!-- single card -->
    <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
      <div class="modal-box">
        <div id="single-issue" class="p-5 space-y-3">
        </div>
        <div class="modal-action">
          <form method="dialog">
            <button class="btn btn-primary">Close</button>
          </form>
        </div>
      </div>
    </dialog>
  </section>
  <script src="./script/script.js"></script>
</body>

</html>
