<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title and fav icon -->
  <title>Github Issue Tracker</title>
  <link rel="shortcut icon" href="asset/github-logo.png" type="image/x-icon">

  <!-- link style css -->
  <link rel="stylesheet" href="./style/style.css">

  <!-- Daisyui and tailwind css connect -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

  <section class="w-[90%] lg:w-[520px] h-[90%] m-auto bg-slate-100 rounded-xl py-10 px-5 mt-20">
    <div class="w-11/12 mx-auto space-y-5">
      <div class="text-center space-y-2">
        <img src="asset/github-logo.png" alt="" class="mx-auto w-[80px]">
        <h3 class="text-2xl font-bold text-gray-950">GitHub Issues Tracker</h3>
        <p class="text-lg text-gray-500">Sign in to manage your issues</p>
      </div>
      <div class="space-y-2">
        <label class="label">Enter Username</label><br>
        <input id="username-input" type="text" class="input w-full" placeholder="Username: admin"><br>
        <label class="label">Password</label><br>
        <input id="password-input" type="password" class="input w-full" placeholder="Password: admin123"><br>
        <button id="sign-in-btn" class="btn btn-primary mt-4 w-full">Sign In</button>
      </div>
    </div>
  </section>

  <script src="./script/login.js"></script>
</body>

</html>
