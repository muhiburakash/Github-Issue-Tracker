<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single Issue</title>
</head>

<body>
  <script>
    const loadSingleIssue = () => {
      fetch('https://phi-lab-server.vercel.app/api/v1/lab/issue/1')
        .then(res => res.json())
        .then(json => {
          const issue = json.data; // the actual data
          console.log(issue);      // log it to the console
        })
        .catch(err => console.error('Error fetching issue:', err));
    };

    loadSingleIssue(); // call the function once
  </script>
</body>

</html>
